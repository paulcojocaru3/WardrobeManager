name: SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # TODO: completează cu valorile tale din SonarCloud (Administration → Update key / pagina proiectului).
  # SONAR_ORG = "organization key"-ul tău (de obicei username-ul de GitHub).
  # SONAR_PROJECT_KEY = de regulă "<org>_<nume-repo>".
  SONAR_ORG: paulcojocaru3
  SONAR_PROJECT_KEY: paulcojocaru3_WardrobeManager

jobs:
  analyze:
    name: Build, test & analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # blame complet pentru "new code"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up JDK 17   # scanner-ul .NET rulează analiza pe Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      # begin → build → test(+coverage) → end. Docker e disponibil pe runner,
      # deci testele de integrare TestContainers rulează normal.
      - name: Analyze
        working-directory: src/WardrobeManager
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /o:"${{ env.SONAR_ORG }}" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.scanner.scanAll=false \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs" \
            /d:sonar.qualitygate.wait=true

          dotnet build WardrobeManager.sln
          dotnet test WardrobeManager.Tests/WardrobeManager.Tests.csproj \
            --no-build --settings coverlet.runsettings
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
