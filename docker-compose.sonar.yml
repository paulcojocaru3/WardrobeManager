# Local SonarQube server (Community) + its own Postgres, for code-quality + coverage analysis.
# Runs on the same `wm-test-net` network the test scanner uses, so the scanner reaches it at
# http://sonarqube:9000. Separate from the app's postgres-db / docker-compose.dev.yml.
#
#   docker compose -f docker-compose.sonar.yml up -d      # start
#   docker compose -f docker-compose.sonar.yml down       # stop (keeps volumes/history)
services:
  sonar-db:
    image: postgres:16
    container_name: wardrobe-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - default

  sonarqube:
    image: sonarqube:community
    container_name: wardrobe-sonarqube
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - default

volumes:
  sonar_db_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:


networks:
  default:
    name: wm-test-net
    external: true
