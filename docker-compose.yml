services:
  postgres-db:
    image: pgvector/pgvector:pg17
    container_name: wardrobe-postgres
    restart: always
    environment:
      - POSTGRES_USER=wardrobe_admin
      - POSTGRES_PASSWORD=wardrobe_pass
      - POSTGRES_DB=wardrobe_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  ml-api:
    image: ml-api:latest
    build:
      context: ./ml_api
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install joblib scikit-learn && uvicorn api:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./ml_api:/app
    depends_on:
      - postgres-db

  wardrobe-web:
    build:
      context: .
      dockerfile: src/WardrobeManager/WardrobeManager.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Database=wardrobe_db;Username=wardrobe_admin;Password=wardrobe_pass
      - FastApi__BaseUrl=http://ml-api:8000
    depends_on:
      - ml-api
      - postgres-db

volumes:
  postgres_data: