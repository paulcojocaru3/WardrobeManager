name: wardrobe-manager

services:
  postgres-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wardrobe_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wardrobe_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - database

  ml-api:
    build:
      context: ./ml_api
    restart: unless-stopped
    init: true
    environment:
      CORS_ALLOWED_ORIGINS: ${APP_ORIGIN:-http://localhost}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-20000000}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - rembg_cache:/root/.u2net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m
    networks:
      - backend

  wardrobe-api:
    build:
      context: .
      dockerfile: src/WardrobeManager/WardrobeManager.API/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres-db;Database=${POSTGRES_DB:-wardrobe_db};Username=${POSTGRES_USER:-wardrobe_admin};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      FastApi__BaseUrl: http://ml-api:8000
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (minimum 32 bytes)}
      Jwt__Issuer: ${JWT_ISSUER:-WardrobeManager}
      Jwt__Audience: ${JWT_AUDIENCE:-WardrobeManager}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-1440}
      WeatherApi__Key: ${WEATHER_API_KEY:-}
      Cors__AllowedOrigins__0: ${APP_ORIGIN:-http://localhost}
      Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      Ollama__Model: ${OLLAMA_MODEL:-gemma3}
      Outfits__Stylist__Enabled: ${OUTFIT_STYLIST_ENABLED:-false}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres-db:
        condition: service_healthy
      ml-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
      - database

  wardrobe-frontend:
    build:
      context: ./wardrobe_web
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      wardrobe-api:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:
  huggingface_cache:
  rembg_cache:

networks:
  backend:
  database:
    internal: true
